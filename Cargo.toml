[package]
name = "oxiparticle"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
# The particle table and the PdgId decoder derive from scikit-hep `particle`
# (BSD-3-Clause; see LICENSE-3rdparty), so the SPDX expression names both.
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/oxihep/oxiparticle"
documentation = "https://docs.rs/oxiparticle"
readme = "README.md"
keywords = ["pdg", "particle", "monte-carlo", "hep", "physics"]
categories = ["science"]
description = "Pure-Rust PDG particle data — the Monte Carlo numbering-scheme decoder plus a bundled particle table (masses, widths, quantum numbers), modelled on scikit-hep/particle"

[dependencies]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
